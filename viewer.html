<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Earth Viewer</title>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://rowangrassscience.github.io/Planet_Grass/spritespin/spritespin.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      width: 100%;
      height: auto;
    }

    #viewer {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>

<body>
  <div id="viewer"></div>

<script>
  // Force viewer to 16:9
  function enforceAspect() {
    const viewer = document.getElementById("viewer");
    const w = viewer.clientWidth;
    const h = Math.round(w * 9 / 16);
    viewer.style.height = h + "px";
  }

  $(function() {
    const frames = [];
    for (let i = 1; i <= 250; i++) {
      const num = String(i).padStart(4, '0');
      frames.push(`https://rowangrassscience.github.io/Planet_Grass/earth_spin_webp/earth_spin${num}.webp`);
    }

    // Create SpriteSpin
    const spin = SpriteSpin.create({
      target: $("#viewer"),
      source: frames,
      responsive: true,
      sense: -1,
      animate: false,
      loop: true,
      renderer: 'canvas',
      plugins: ['drag', 'zoom'],
      inertia: true,
      zoomMax: 3,
      zoomMin: 0.3,
      zoomStep: 0.1
    });

    // Run AFTER SpriteSpin creates the canvas
    setTimeout(enforceAspect, 0);

    // Run again AFTER first frame loads
    const waitForLoad = setInterval(() => {
      if (spin.firstLoaded) {
        enforceAspect();
        clearInterval(waitForLoad);
      }
    }, 30);

    // Run on window resize
    window.addEventListener("resize", enforceAspect);
  });
</script>
</body>
</html>
