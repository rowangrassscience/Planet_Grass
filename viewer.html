<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Earth Viewer</title>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://rowangrassscience.github.io/Planet_Grass/spritespin/spritespin.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      width: 100%;
      height: auto;
    }

    #viewer {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>

<body>
  <div id="viewer"></div>

<script>
function enforceAspect() {
  const viewer = document.getElementById("viewer");
  const w = viewer.clientWidth;
  const h = Math.round(w * 9 / 16);
  viewer.style.height = h + "px";
}
</script>

<script>
$(function() {
  // 1. Set aspect before SpriteSpin runs
  enforceAspect();

  // 2. Create SpriteSpin
  const spin = SpriteSpin.create({...});

  // 3. After first frame loads, enforce again
  const wait = setInterval(() => {
    if (spin.firstLoaded) {
      enforceAspect();
      clearInterval(wait);
    }
  }, 30);

  // 4. On resize
  window.addEventListener("resize", enforceAspect);
});
</script>
</body>
</html>
